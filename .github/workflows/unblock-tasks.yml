# Promote task issues from status:blocked to status:ready as soon as every issue listed under
# "### Depends on" is closed (i.e. its PR merged). Runs when any issue closes, hourly as a
# safety net, and on demand.
name: unblock-tasks

on:
  issues:
    types: [closed, reopened, edited]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: unblock-tasks
  cancel-in-progress: false

jobs:
  unblock:
    name: unblock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Promote unblocked tasks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: scripts/unblock_tasks.sh
