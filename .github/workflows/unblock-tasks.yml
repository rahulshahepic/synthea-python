# Keep task status labels current (ready / startable / blocked / stale); see
# scripts/unblock_tasks.sh. Runs on issue changes (incl. claims), hourly, and on demand.
name: unblock-tasks

on:
  issues:
    types: [closed, reopened, edited, labeled, unlabeled]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: unblock-tasks
  cancel-in-progress: false

jobs:
  unblock:
    name: unblock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Promote unblocked tasks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: scripts/unblock_tasks.sh
