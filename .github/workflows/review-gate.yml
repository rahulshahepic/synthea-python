# Publishes the required commit status `review-gate`:
#   pending -> waiting for the reviewer (shown amber, not as a failure)
#   success -> the PR carries `review:approved` (added only by the reviewer)
# Any new commit pushed by an agent removes `review:approved`, so an approval only covers the
# commit that was reviewed. Automated checks (ci.yml) run independently on every push and are
# never blocked by this gate. The auto-sync bot dispatches this workflow with a PR number,
# because pushes made with GITHUB_TOKEN don't trigger workflows.
name: review-gate

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate
        required: true

permissions:
  pull-requests: write
  issues: write
  statuses: write

jobs:
  publish:
    name: review-gate-status
    runs-on: ubuntu-latest
    steps:
      - name: Publish review-gate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          ACTION: ${{ github.event.action }}
        run: |
          read -r sha labels < <(gh pr view "$PR" --repo "$REPO" \
            --json headRefOid,labels --jq '[.headRefOid, ([.labels[].name] | join(","))] | @tsv')
          # An auto-sync merge of main (by the sync bot) keeps the approval; anything else revokes it.
          head_msg="$(gh api "repos/$REPO/commits/$sha" --jq '.commit.message | split("\n")[0]')"
          head_author="$(gh api "repos/$REPO/commits/$sha" --jq '.commit.author.name')"
          auto_sync=false
          if [[ "$head_author" == "github-actions[bot]" && "$head_msg" == *"(auto-sync)" ]]; then auto_sync=true; fi
          if [[ "$ACTION" == "synchronize" && "$auto_sync" != "true" && ",$labels," == *",review:approved,"* ]]; then
            gh pr edit "$PR" --repo "$REPO" --remove-label "review:approved" --add-label "review:needed"
            labels="${labels//review:approved/}"
            echo "New commits after approval: approval removed, re-review required."
          fi
          if [[ ",$labels," == *",review:approved,"* ]]; then
            state=success; desc="Approved by reviewer"
          else
            state=pending; desc="Waiting for reviewer (label review:approved)"
          fi
          gh api "repos/$REPO/statuses/$sha" -f state="$state" -f context="review-gate" \
            -f description="$desc" >/dev/null
          echo "review-gate=$state on $sha"
