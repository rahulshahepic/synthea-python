# Local overrides for the Python port: write CSV, which is the only exporter this port
# implements. Java's defaults turn FHIR on and CSV off; with them the port writes no files.
# Use with:  uv run run_synthea -c config/csv.properties [options] [state [city]]
exporter.csv.export = true
exporter.fhir.export = false
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false
exporter.metadata.export = false
