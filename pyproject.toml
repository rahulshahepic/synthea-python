[project]
name = "synthea"
version = "0.1.0"
description = "Python port of Synthea (synthetic patient generator), seed-for-seed equivalent to the Java reference."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
run_synthea = "synthea.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthea"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["java", "parity/build", "parity/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "N802",  # Java method names are kept recognisable (snake_case still preferred, see PORTING_GUIDE)
    "N815",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "parity: compares Python output against goldens produced by the Java reference",
]
